<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Audit Accessibilité ERP</title>

  <!-- Configuration PWA & Compatibilité iOS / Android -->
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Audit ERP">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='%232563eb'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%2360a5fa'>♿</text></svg>">

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --primary-dark: #1d4ed8;
      --conform-color: #0284c7; /* Bleu océan pour Conforme - AUCUN VERT */
      --nc-color: #dc2626;      /* Rouge pour Non Conforme */
      --so-color: #64748b;      /* Ardoise pour Sans Objet */
      --warn-color: #d97706;    /* Ambre pour Alerte */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
    
    .gauge-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .gauge-bar-bg { flex: 1; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
    .gauge-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
    .gauge-text { font-size: 0.85rem; font-weight: 700; color: var(--primary-light); min-width: 48px; text-align: right; }

    .container { padding: 14px; max-width: 900px; margin: 0 auto; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: var(--primary-light); display: flex; justify-content: space-between; align-items: center; }

    label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 10px; font-size: 0.9rem; margin-bottom: 10px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    /* Sélecteur de profil */
    .profile-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .profile-tab {
      background: #0f172a; border: 1px solid #334155; color: var(--text-muted); padding: 8px 4px; font-size: 0.75rem; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .profile-tab.active { background: var(--primary); color: #fff; border-color: var(--primary-light); }

    /* Sélecteur d'étage */
    .etage-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .etage-btn {
      background: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 14px; font-size: 0.85rem; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: 600;
    }
    .etage-btn.active { background: var(--primary-dark); border-color: var(--primary-light); color: #fff; }
    .btn-add-etage { background: #334155; border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    /* Critères d'audit */
    .criterion-item { background: #162032; border: 1px solid #2d3c52; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .crit-title { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .crit-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.3; }
    
    .status-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .status-btn {
      background: #0f172a; border: 1px solid #334155; color: var(--text-muted); padding: 8px; font-size: 0.8rem; font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center;
    }
    .status-btn.c.active { background: var(--conform-color); color: #fff; border-color: #38bdf8; }
    .status-btn.nc.active { background: var(--nc-color); color: #fff; border-color: #f87171; }
    .status-btn.so.active { background: var(--so-color); color: #fff; border-color: #94a3b8; }

    .photo-preview-wrap { display: flex; gap: 8px; overflow-x: auto; margin-top: 6px; }
    .photo-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #475569; }

    /* Barre d'action fixe en bas */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid var(--card-border); padding: 10px 14px; display: flex; gap: 8px; z-index: 100;
    }
    .btn-action {
      flex: 1; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 0.8rem; font-weight: 600; text-align: center; cursor: pointer;
    }
    .btn-primary { background: var(--primary); border-color: var(--primary-light); }

    /* Impression PDF */
    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      header, .bottom-bar, .profile-tabs, .etage-scroll, .btn-add-etage, input[type="file"], .status-btns { display: none !important; }
      .card, .criterion-item { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; break-inside: avoid; }
      .crit-title { color: #000 !important; }
      .print-status { display: block !important; font-weight: bold; margin-top: 4px; }
    }
    .print-status { display: none; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title" id="displayErpNom">Audit Accessibilité ERP</div>
      <div style="font-size: 0.8rem; color: var(--text-muted);" id="currentCategoryBadge">5e Catégorie</div>
    </div>
    <div class="gauge-wrapper">
      <div class="gauge-bar-bg">
        <div id="gaugeBar" class="gauge-bar-fill"></div>
      </div>
      <div id="gaugeScore" class="gauge-text">0 %</div>
    </div>
  </header>

  <div class="container">
    <!-- Sélection de l'ERP & Import Parc CSV -->
    <div class="card">
      <div class="card-title">
        <span>Bâtiment audité</span>
        <button type="button" class="btn-action" style="flex:none; padding:4px 8px; font-size:0.75rem;" onclick="document.getElementById('csvInput').click()">Importer Parc (CSV)</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="importerParcCSV(event)">
      </div>
      <label>Sélectionner un bâtiment du parc :</label>
      <select id="erpSelect" onchange="changerErpSelectionne(this.value)">
        <option value="">-- Saisie manuelle ou choisir un ERP --</option>
      </select>
      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px;">
        <div>
          <label>Nom de l'établissement :</label>
          <input type="text" id="nomERP" placeholder="ex: Groupe Scolaire Curie" oninput="mettreAJourNom(this.value)">
        </div>
        <div>
          <label>Date :</label>
          <input type="date" id="dateAudit">
        </div>
      </div>
    </div>

    <!-- Choix du Profil Réglementaire -->
    <div class="card">
      <label>Profil réglementaire appliqué :</label>
      <div class="profile-tabs">
        <div class="profile-tab active" id="prof_neuf" onclick="changerProfil('neuf')">Neuf (Arrêté 2017)</div>
        <div class="profile-tab" id="prof_existant_1_4" onclick="changerProfil('existant_1_4')">Existant (Cat 1-4)</div>
        <div class="profile-tab" id="prof_existant_5" onclick="changerProfil('existant_5')">Existant (5e Cat)</div>
      </div>
    </div>

    <!-- Navigation Niveaux / Étages -->
    <div class="card">
      <div class="card-title">
        <span>Zone / Niveau évalué</span>
      </div>
      <div class="etage-scroll" id="etagesConteneur">
        <button type="button" class="etage-btn active" onclick="selectionnerEtage('tronc')">Extérieurs & Accueil</button>
        <button type="button" class="etage-btn" onclick="selectionnerEtage('RDC')">RDC</button>
      </div>
      <button type="button" class="btn-add-etage" onclick="ajouterEtage()">+ Ajouter un étage / sous-sol</button>
    </div>

    <!-- Liste des critères d'évaluation dynamique -->
    <div id="listeCriteres"></div>
  </div>

  <!-- Barre d'action fixe inférieure -->
  <div class="bottom-bar">
    <button type="button" class="btn-action" onclick="document.getElementById('jsonInput').click()">📂 Ouvrir</button>
    <button type="button" class="btn-action" onclick="exporterAuditJSON()">💾 Enregistrer</button>
    <button type="button" class="btn-action" onclick="exporterSyntheseCSV()">📊 Synthèse CSV</button>
    <button type="button" class="btn-action btn-primary" onclick="window.print()">🖨 Rapport PDF</button>
    <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="importerAuditJSON(event)">
  </div>

  <script>
    // --- 1. BASE DE DONNÉES DES CRITÈRES EXHAUSTIFS ---
    const REFERENTIEL = {
      tronc: [
        {
          id: "stationnement",
          titre: "Stationnement réservé PMR",
          desc: "≥ 2 % des places (min 1). Largeur ≥ 3,30 m, pente ≤ 2 %. Raccordement direct sans ressaut.",
          neuf: "Largeur stricte 3,30 m, pente max 2 %.",
          existant_1_4: "Emplacement au plus proche de l'entrée, bateau d'accès sans ressaut > 2 cm.",
          existant_5: "Si parking réservé au public : 1 place adaptée obligatoire sauf contrainte technique."
        },
        {
          id: "cheminement_ext",
          titre: "Cheminement d'accès extérieur",
          desc: "Largeur libre ≥ 1,20 m. Absence d'obstacle au sol. Sol non meuble et antidérapant.",
          neuf: "Pente ≤ 5 % (tolérance 8 % sur 2 m, 10 % sur 0,5 m). Paliers de repos de 1,40 × 1,20 m.",
          existant_1_4: "Tolérance de pente jusqu'à 12 % sur 0,50 m si impossibilité topographique.",
          existant_5: "Tolérance élargie et dérogation possible si dénivelé de voirie insurmontable."
        },
        {
          id: "entree_seuil",
          titre: "Porte d'entrée & Seuil",
          desc: "Largeur utile minimale, manœuvre de porte Ø 1,50 m, seuil plat ou chanfreiné.",
          neuf: "Largeur utile ≥ 0,83 m. Seuil ≤ 2 cm chanfreiné. Effort d'ouverture ≤ 50 N.",
          existant_1_4: "Largeur utile ≥ 0,77 m admise. Dispositif d'appel extérieur si seuil non modifiable.",
          existant_5: "Largeur utile ≥ 0,77 m admise. Visiophone/sonnette accessible entre 0,90 et 1,30 m."
        },
        {
          id: "accueil_banque",
          titre: "Banque d'accueil & Sonorisation",
          desc: "Poste abaissé avec vide pour les genoux. Boucle à Induction Magnétique (BIM).",
          neuf: "Partie surbaissée hauteur ≤ 0,80 m, vide sous table 0,70×0,60 m. BIM fixe obligatoire.",
          existant_1_4: "Hauteur ≤ 0,80 m ou tablette amovible. BIM fixe à l'accueil principal.",
          existant_5: "Tablette ou guichet abaissé. BIM mobile tolérée si accueil ponctuel."
        },
        {
          id: "eclairage_ext_accueil",
          titre: "Éclairage & Luxmétrie (Abords & Accueil)",
          desc: "Éclairement minimal mesuré au sol et absence d'éblouissement.",
          neuf: "≥ 20 lux sur cheminement ext., ≥ 100 lux sous abri, ≥ 200 lux au poste d'accueil.",
          existant_1_4: "≥ 20 lux ext., ≥ 200 lux au poste d'accueil pour la lecture labiale.",
          existant_5: "Éclairage direct suffisant sur le visage de l'agent sans contre-jour."
        },
        {
          id: "registre_rpa",
          titre: "Registre Public d'Accessibilité (RPA)",
          desc: "Mise à disposition du public des attestations, formation du personnel et fiches.",
          neuf: "Document complet disponible à l'accueil et consultable en ligne ou sur place.",
          existant_1_4: "Attestation de conformité ou calendrier d'agenda d'accessibilité (Ad'AP).",
          existant_5: "RPA obligatoire sous format allégé (attestation, fiche synthétique, formation accueil)."
        }
      ],
      etage: [
        {
          id: "circulations_horiz",
          titre: "Circulations horizontales intérieures",
          desc: "Largeur utile des couloirs, passage sans obstacle et zones d'évitement.",
          neuf: "Largeur nominale ≥ 1,40 m continu. Espaces de demi-tour (Ø 1,50 m) tous les 6 m.",
          existant_1_4: "Largeur ≥ 1,20 m principal (0,90 m ponctuel admis avec zones de croisement).",
          existant_5: "Largeur ≥ 1,20 m (0,90 m toléré en circulation secondaire)."
        },
        {
          id: "portes_interieures",
          titre: "Portes intérieures & Sas",
          desc: "Largeur de passage utile, poignées facilement manœuvrables (0,90 m à 1,30 m).",
          neuf: "Largeur libre ≥ 0,83 m. Espace de manœuvre rectangulaire hors débattement.",
          existant_1_4: "Largeur utile ≥ 0,77 m admise. Poignées préhensibles sans serrage du poignet.",
          existant_5: "Largeur utile ≥ 0,77 m admise."
        },
        {
          id: "escaliers_interieurs",
          titre: "Escaliers intérieurs (si présents au niveau)",
          desc: "Sécurisation tactile, visuelle et préhension des marches.",
          neuf: "BEV à 50 cm du nez supérieur. 1re/dernière contremarches contrastées. 2 mains courantes.",
          existant_1_4: "Idem neuf. 1 seule main courante admise si largeur utile < 1,00 m.",
          existant_5: "BEV et nez de marches antidérapants obligatoires. 1 main courante tolérée."
        },
        {
          id: "ascenseur_desserte",
          titre: "Ascenseur / Desserte verticale",
          desc: "Cabine adaptée et annonces multisensorielles.",
          neuf: "Obligatoire si étage > 50 personnes. Cabine 1,10×1,40 m, annonces vocales et visuelles.",
          existant_1_4: "Ascenseur ou appareil élévateur obligatoire sauf dérogation technique ou disproportion.",
          existant_5: "NON OBLIGATOIRE si l'ensemble des prestations délivrées est accessible au rez-de-chaussée."
        },
        {
          id: "sanitaires_pmr",
          titre: "Cabinet d'aisances adapté (PMR)",
          desc: "Espace latéral de transfert, cuvette à hauteur et barre d'appui.",
          neuf: "Espace d'usage 0,80×1,30 m à côté de la cuvette (0,45-0,50 m). Ø 1,50 m hors débattement.",
          existant_1_4: "Débattement de porte empiétant sur le cercle admis si ouverture vers l'extérieur.",
          existant_5: "SANS OBJET si les sanitaires sont exclusivement réservés au personnel."
        },
        {
          id: "acoustique_reverb",
          titre: "Traitement acoustique & Réverbération",
          desc: "Limitation de l'écho dans les espaces d'attente et salles de réunion.",
          neuf: "Temps de réverbération Tr ≤ 0,8 s à 1,2 s selon volume (matériaux absorbants).",
          existant_1_4: "Traitement obligatoire lors de travaux de rénovation de faux-plafonds ou revêtements.",
          existant_5: "Vérifier l'intelligibilité de la parole dans les espaces d'entretien individuel."
        },
        {
          id: "obstacles_220",
          titre: "Obstacles en saillie sous 2,20 m",
          desc: "Détection des obstacles bas à la canne blanche pour les malvoyants.",
          neuf: "Tout élément saillant sous 2,20 m doit comporter un rappel au sol à moins de 0,40 m.",
          existant_1_4: "Équipements suspendus (écrans, sous-faces d'escaliers) sécurisés ou prolongés au sol.",
          existant_5: "Vérifier les caissons et tableaux sous les montées d'escalier."
        },
        {
          id: "signaletique_vitrages",
          titre: "Signalétique & Vitrages",
          desc: "Hauteurs de lisibilité, contraste visuel et repérage des baies vitrées.",
          neuf: "Vitrages munis de bandes contrastées à 1,10 m et 1,60 m. Signalétique tactile/visuelle à 1,30 m.",
          existant_1_4: "Vitrages transparents obligatoirement signalés. Contraste ≥ 70 % sur panneaux d'orientation.",
          existant_5: "Vitrages repérés à hauteur des yeux et des enfants."
        },
        {
          id: "securite_eas_alarmes",
          titre: "Évacuation adaptée, EAS & Alarmes",
          desc: "Espace d'Attente Sécurisé et bimodalité sonore/lumineuse de l'alarme.",
          neuf: "EAS par étage accessible aux PMR avec interphone. Flashs lumineux dans les sanitaires.",
          existant_1_4: "EAS aménagé dans les cages d'escaliers encloisonnées. Flash d'alarme dans les WC isolés.",
          existant_5: "Vérification des diffuseurs lumineux d'alarme dans les locaux isolés."
        }
      ]
    };

    // --- 2. GESTION DE L'ÉTAT DE L'APPLICATION ---
    let auditActuel = {
      erpId: "",
      nom: "Audit Sans Titre",
      date: new Date().toISOString().slice(0, 10),
      profil: "existant_5",
      etageActif: "tronc",
      etages: ["tronc", "RDC"],
      evaluations: {}, // format: { [etage]: { [critId]: { status: 'C'|'NC'|'SO', note: '', photos: [] } } }
      parc: []
    };

    // Initialisation
    window.addEventListener('load', () => {
      document.getElementById('dateAudit').value = auditActuel.date;
      chargerDonneesLocales();
      rendreInterface();
    });

    function chargerDonneesLocales() {
      const sauvegarde = localStorage.getItem('audit_erp_data');
      if (sauvegarde) {
        try {
          const parsed = JSON.parse(sauvegarde);
          auditActuel = { ...auditActuel, ...parsed };
          document.getElementById('nomERP').value = auditActuel.nom;
          document.getElementById('dateAudit').value = auditActuel.date;
        } catch (e) {
          console.error("Erreur de chargement local", e);
        }
      }
    }

    function sauvegarderLocal() {
      localStorage.setItem('audit_erp_data', JSON.stringify(auditActuel));
      calculerScore();
    }

    function mettreAJourNom(val) {
      auditActuel.nom = val || "Audit Sans Titre";
      document.getElementById('displayErpNom').innerText = auditActuel.nom;
      sauvegarderLocal();
    }

    function changerProfil(nouveauProfil) {
      auditActuel.profil = nouveauProfil;
      document.querySelectorAll('.profile-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(`prof_${nouveauProfil}`).classList.add('active');
      
      const badge = document.getElementById('currentCategoryBadge');
      if (nouveauProfil === 'neuf') badge.innerText = "Neuf (Arrêté 2017)";
      else if (nouveauProfil === 'existant_1_4') badge.innerText = "Existant (Cat 1 à 4)";
      else badge.innerText = "Existant (5e Catégorie)";

      rendreCriteres();
      sauvegarderLocal();
    }

    function selectionnerEtage(etage) {
      auditActuel.etageActif = etage;
      document.querySelectorAll('.etage-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.etage-btn')).find(b => b.innerText.includes(etage === 'tronc' ? 'Extérieurs' : etage));
      if (activeBtn) activeBtn.classList.add('active');
      rendreCriteres();
    }

    function ajouterEtage() {
      const nom = prompt("Désignation du niveau à ajouter (ex: R+1, Sous-sol, Mezzanine) :");
      if (!nom || auditActuel.etages.includes(nom)) return;
      auditActuel.etages.push(nom);
      rendreOngletsEtages();
      selectionnerEtage(nom);
      sauvegarderLocal();
    }

    function rendreOngletsEtages() {
      const cont = document.getElementById('etagesConteneur');
      cont.innerHTML = `
        <button type="button" class="etage-btn ${auditActuel.etageActif === 'tronc' ? 'active' : ''}" onclick="selectionnerEtage('tronc')">Extérieurs & Accueil</button>
      `;
      auditActuel.etages.filter(e => e !== 'tronc').forEach(et => {
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = `etage-btn ${auditActuel.etageActif === et ? 'active' : ''}`;
        btn.innerText = et;
        btn.onclick = () => selectionnerEtage(et);
        cont.appendChild(btn);
      });
    }

    function rendreCriteres() {
      const cont = document.getElementById('listeCriteres');
      cont.innerHTML = "";

      const estTronc = auditActuel.etageActif === 'tronc';
      const liste = estTronc ? REFERENTIEL.tronc : REFERENTIEL.etage;

      if (!auditActuel.evaluations[auditActuel.etageActif]) {
        auditActuel.evaluations[auditActuel.etageActif] = {};
      }
      const evalEtage = auditActuel.evaluations[auditActuel.etageActif];

      liste.forEach(crit => {
        const etat = evalEtage[crit.id] || { status: null, note: "", photos: [] };
        const regleSpecifique = crit[auditActuel.profil] || crit.desc;

        const card = document.createElement('div');
        card.className = "criterion-item";
        card.innerHTML = `
          <div class="crit-title">${crit.titre}</div>
          <div class="crit-desc">${crit.desc}</div>
          <div style="background:#0f172a; padding:6px 10px; border-radius:6px; font-size:0.75rem; color:#38bdf8; margin-bottom:8px; border-left:3px solid var(--primary);">
            <strong>Règle profil :</strong> ${regleSpecifique}
          </div>

          <div class="status-btns">
            <div class="status-btn c ${etat.status === 'C' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'C')">Conforme</div>
            <div class="status-btn nc ${etat.status === 'NC' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'NC')">Non Conforme</div>
            <div class="status-btn so ${etat.status === 'SO' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'SO')">Sans Objet</div>
          </div>

          <div class="print-status">Constat : <strong>${etat.status || 'Non vérifié'}</strong></div>

          <textarea placeholder="Constats techniques, cotes relevées, préconisations..." style="margin-bottom:6px; height:50px;" oninput="majNote('${crit.id}', this.value)">${etat.note || ''}</textarea>

          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="margin:0; cursor:pointer; font-size:0.75rem; color:var(--primary-light);">
              📷 Prendre une photo
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="ajouterPhoto('${crit.id}', event)">
            </label>
            <div class="photo-preview-wrap" id="photos_${crit.id}">
              ${(etat.photos || []).map(src => `<img src="${src}" class="photo-thumb">`).join('')}
            </div>
          </div>
        `;
        cont.appendChild(card);
      });

      calculerScore();
    }

    function definirStatut(critId, statut) {
      if (!auditActuel.evaluations[auditActuel.etageActif]) {
        auditActuel.evaluations[auditActuel.etageActif] = {};
      }
      if (!auditActuel.evaluations[auditActuel.etageActif][critId]) {
        auditActuel.evaluations[auditActuel.etageActif][critId] = { status: null, note: "", photos: [] };
      }
      auditActuel.evaluations[auditActuel.etageActif][critId].status = statut;
      rendreCriteres();
      sauvegarderLocal();
    }

    function majNote(critId, val) {
      if (!auditActuel.evaluations[auditActuel.etageActif][critId]) {
        auditActuel.evaluations[auditActuel.etageActif][critId] = { status: null, note: "", photos: [] };
      }
      auditActuel.evaluations[auditActuel.etageActif][critId].note = val;
      sauvegarderLocal();
    }

    function ajouterPhoto(critId, ev) {
      const file = ev.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        // Redimensionnement automatique pour économiser le stockage
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

          if (!auditActuel.evaluations[auditActuel.etageActif][critId]) {
            auditActuel.evaluations[auditActuel.etageActif][critId] = { status: null, note: "", photos: [] };
          }
          if (!auditActuel.evaluations[auditActuel.etageActif][critId].photos) {
            auditActuel.evaluations[auditActuel.etageActif][critId].photos = [];
          }
          auditActuel.evaluations[auditActuel.etageActif][critId].photos.push(dataUrl);
          rendreCriteres();
          sauvegarderLocal();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function calculerScore() {
      let conformes = 0;
      let nonConformes = 0;

      Object.keys(auditActuel.evaluations).forEach(et => {
        const obj = auditActuel.evaluations[et];
        Object.keys(obj).forEach(cId => {
          const s = obj[cId].status;
          if (s === 'C') conformes++;
          else if (s === 'NC') nonConformes++;
        });
      });

      const total = conformes + nonConformes;
      const score = total > 0 ? Math.round((conformes / total) * 100) : 0;

      document.getElementById('gaugeBar').style.width = `${score}%`;
      document.getElementById('gaugeScore').innerText = `${score} %`;
    }

    function rendreInterface() {
      document.getElementById('displayErpNom').innerText = auditActuel.nom;
      document.getElementById(`prof_${auditActuel.profil}`).click();
      rendreOngletsEtages();
      rendreCriteres();
    }

    // --- 3. GESTION DU PARC IMMOBILIER (CSV) ---
    function importerParcCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const lignes = text.split(/\r\n|\n/).filter(l => l.trim() !== "");
        if (lignes.length < 2) {
          alert("Fichier CSV vide ou non conforme.");
          return;
        }

        auditActuel.parc = [];
        const entetes = lignes[0].toLowerCase().split(/[;,]/);

        for (let i = 1; i < lignes.length; i++) {
          const cols = lignes[i].split(/[;,]/);
          if (cols.length >= 2) {
            auditActuel.parc.push({
              id: "erp_" + i,
              nom: cols[0].trim(),
              adresse: cols[1] ? cols[1].trim() : "",
              cat: cols[2] ? cols[2].trim() : "5",
              niveaux: cols[4] ? cols[4].split(',').map(s => s.trim()) : ["RDC"]
            });
          }
        }

        remplirSelecteurParc();
        sauvegarderLocal();
        alert(`${auditActuel.parc.length} ERP importés dans le parc !`);
      };
      reader.readAsText(file);
    }

    function remplirSelecteurParc() {
      const sel = document.getElementById('erpSelect');
      sel.innerHTML = '<option value="">-- Choisir un bâtiment dans le parc --</option>';
      auditActuel.parc.forEach(erp => {
        const opt = document.createElement('option');
        opt.value = erp.id;
        opt.innerText = `${erp.nom} (${erp.adresse || 'Cat. ' + erp.cat})`;
        sel.appendChild(opt);
      });
    }

    function changerErpSelectionne(id) {
      const erp = auditActuel.parc.find(e => e.id === id);
      if (!erp) return;

      auditActuel.nom = erp.nom;
      document.getElementById('nomERP').value = erp.nom;
      document.getElementById('displayErpNom').innerText = erp.nom;

      // Déduction du profil
      if (erp.cat === "5") changerProfil('existant_5');
      else changerProfil('existant_1_4');

      // Création des étages
      auditActuel.etages = ["tronc", ...erp.niveaux];
      auditActuel.etageActif = "tronc";
      rendreOngletsEtages();
      rendreCriteres();
      sauvegarderLocal();
    }

    // --- 4. EXPORT / IMPORT JSON ET CSV SYNTHÈSE ---
    function exporterAuditJSON() {
      const blob = new Blob([JSON.stringify(auditActuel, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Audit_${auditActuel.nom.replace(/\s+/g, '_')}_${auditActuel.date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importerAuditJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          auditActuel = JSON.parse(e.target.result);
          document.getElementById('nomERP').value = auditActuel.nom;
          document.getElementById('dateAudit').value = auditActuel.date;
          remplirSelecteurParc();
          rendreInterface();
          alert("Audit rechargé avec succès !");
        } catch (err) {
          alert("Erreur de décodage du fichier JSON.");
        }
      };
      reader.readAsText(file);
    }

    function exporterSyntheseCSV() {
      let csv = "Zone/Niveau;Critere;Statut;Constat\n";
      Object.keys(auditActuel.evaluations).forEach(et => {
        const obj = auditActuel.evaluations[et];
        Object.keys(obj).forEach(cId => {
          const item = obj[cId];
          csv += `"${et}";"${cId}";"${item.status || ''}";"${(item.note || '').replace(/"/g, '""')}"\n`;
        });
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Synthese_${auditActuel.nom.replace(/\s+/g, '_')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Service Worker autonome pour exécution hors-ligne
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          const CACHE = 'audit-erp-no-green-v1';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
