  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --primary-dark: #1d4ed8;
      --conform-color: #0284c7; /* Bleu océan - Zéro vert */
      --nc-color: #dc2626;      /* Rouge carmin */
      --so-color: #64748b;      /* Ardoise */
      --warn-color: #d97706;    /* Ambre */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
    
    .gauge-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .gauge-bar-bg { flex: 1; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; }
    .gauge-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
    .gauge-text { font-size: 0.85rem; font-weight: 700; color: var(--primary-light); min-width: 48px; text-align: right; }

    .container { padding: 14px; max-width: 900px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: var(--primary-light); display: flex; justify-content: space-between; align-items: center; }

    label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 10px; font-size: 0.9rem; margin-bottom: 10px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .adap-banner {
      background: #0f1e36; border: 1px solid #1e3a5f; border-radius: 10px; padding: 12px; margin-bottom: 12px;
    }
    .adap-banner-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .adap-badge { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
    .badge-realise { background: #0369a1; color: #fff; }
    .badge-encours { background: #b45309; color: #fff; }
    .adap-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .adap-stat-val { font-weight: 700; color: #fff; font-size: 0.85rem; }
    .adap-comment {
      font-size: 0.78rem; color: #93c5fd; background: #091322; padding: 8px 10px; border-radius: 6px; line-height: 1.35; border-left: 3px solid var(--primary-light);
    }

    .profile-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .profile-tab {
      background: #0f172a; border: 1px solid #334155; color: var(--text-muted); padding: 8px 4px; font-size: 0.75rem; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .profile-tab.active { background: var(--primary); color: #fff; border-color: var(--primary-light); }

    .etage-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .etage-btn {
      background: #0f172a; border: 1px solid #334155; color: #fff; padding: 6px 14px; font-size: 0.85rem; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: 600;
    }
    .etage-btn.active { background: var(--primary-dark); border-color: var(--primary-light); color: #fff; }
    .btn-add-etage { background: #334155; border: none; color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }

    .criterion-item { background: #162032; border: 1px solid #2d3c52; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .crit-title { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .crit-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.3; }
    
    .status-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
    .status-btn {
      background: #0f172a; border: 1px solid #334155; color: var(--text-muted); padding: 10px 4px; font-size: 0.8rem; font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center; min-height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .status-btn.c.active { background: var(--conform-color); color: #fff; border-color: #38bdf8; }
    .status-btn.nc.active { background: var(--nc-color); color: #fff; border-color: #f87171; }
    .status-btn.so.active { background: var(--so-color); color: #fff; border-color: #94a3b8; }

    .photo-preview-wrap { display: flex; gap: 8px; overflow-x: auto; margin-top: 6px; }
    .photo-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #475569; }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid var(--card-border); padding: 10px 14px; display: flex; gap: 8px; z-index: 100;
    }
    .btn-action {
      flex: 1; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 10px 4px; font-size: 0.78rem; font-weight: 600; text-align: center; cursor: pointer; min-height: 44px;
    }
    .btn-primary { background: var(--primary); border-color: var(--primary-light); }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; }
      header, .bottom-bar, .profile-tabs, .etage-scroll, .btn-add-etage, input[type="file"], .status-btns { display: none !important; }
      .card, .criterion-item, .adap-banner { background: #fff !important; border: 1px solid #ccc !important; color: #000 !important; break-inside: avoid; }
      .crit-title, .adap-stat-val { color: #000 !important; }
      .adap-comment { background: #f1f5f9 !important; color: #1e293b !important; border-left-color: #2563eb !important; }
      .print-status { display: block !important; font-weight: bold; margin-top: 4px; }
    }
    .print-status { display: none; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="header-title" id="displayErpNom">Audit Accessibilité ERP</div>
      <div style="font-size: 0.8rem; color: var(--text-muted);" id="currentCategoryBadge">5e Catégorie</div>
    </div>
    <div class="gauge-wrapper">
      <div class="gauge-bar-bg">
        <div id="gaugeBar" class="gauge-bar-fill"></div>
      </div>
      <div id="gaugeScore" class="gauge-text">0 %</div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">
        <span>Bâtiment communal (Ville d'Aubagne)</span>
        <button type="button" class="btn-action" style="flex:none; padding:4px 8px; font-size:0.75rem; min-height:30px;" onclick="document.getElementById('csvInput').click()">Recharger CSV</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="chargerFichierCsvLocal(event)">
      </div>
      <label>Sélectionner parmi les 87 bâtiments communaux :</label>
      <select id="erpSelect" onchange="changerErpSelectionne(this.value)">
        <option value="">Chargement de la liste...</option>
      </select>
      
      <div id="adapInfoBox" class="adap-banner" style="display:none;">
        <div class="adap-banner-top">
          <span style="font-size:0.8rem; font-weight:700; color:var(--primary-light);">Suivi Ad'Ap Ville d'Aubagne</span>
          <span id="adapStatutBadge" class="adap-badge badge-realise">Réalisé</span>
        </div>
        <div class="adap-stats">
          <div>Taux 2015 : <span id="adapTaux2015" class="adap-stat-val">37 %</span></div>
          <div>Cible Ad'Ap : <span id="adapTauxCible" class="adap-stat-val">100 %</span></div>
          <div>Budget tvx : <span id="adapMontant" class="adap-stat-val">33 776 €</span></div>
        </div>
        <div id="adapCommentaire" class="adap-comment">Travaux réalisés</div>
      </div>

      <div style="display:grid; grid-template-columns: 2fr 1fr; gap:8px;">
        <div>
          <label>Nom du bâtiment :</label>
          <input type="text" id="nomERP" placeholder="ex: Théâtre Le Comoedia" oninput="mettreAJourNom(this.value)">
        </div>
        <div>
          <label>Date de visite :</label>
          <input type="date" id="dateAudit">
        </div>
      </div>
    </div>

    <div class="card">
      <label>Profil réglementaire appliqué :</label>
      <div class="profile-tabs">
        <div class="profile-tab" id="prof_neuf" onclick="changerProfil('neuf')">Neuf (Arrêté 2017)</div>
        <div class="profile-tab" id="prof_existant_1_4" onclick="changerProfil('existant_1_4')">Existant (Cat 1-4)</div>
        <div class="profile-tab active" id="prof_existant_5" onclick="changerProfil('existant_5')">Existant (5e Cat)</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>Zone / Niveau évalué</span></div>
      <div class="etage-scroll" id="etagesConteneur">
        <button type="button" class="etage-btn active" onclick="selectionnerEtage('tronc')">Extérieurs & Accueil</button>
        <button type="button" class="etage-btn" onclick="selectionnerEtage('RDC')">RDC</button>
      </div>
      <button type="button" class="btn-add-etage" onclick="ajouterEtage()">+ Ajouter un étage / sous-sol</button>
    </div>

    <div id="listeCriteres"></div>
  </div>

  <div class="bottom-bar">
    <button type="button" class="btn-action" onclick="document.getElementById('jsonInput').click()">📂 Ouvrir</button>
    <button type="button" class="btn-action" onclick="exporterAuditJSON()">💾 Sauvegarder</button>
    <button type="button" class="btn-action" onclick="exporterSyntheseCSV()">📊 CSV</button>
    <button type="button" class="btn-action btn-primary" onclick="window.print()">🖨 PDF</button>
    <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="importerAuditJSON(event)">
  </div>

  <script>
    const REFERENTIEL = {
      tronc: [
        { id: "stationnement", titre: "Stationnement réservé PMR", desc: "≥ 2 % des places (min 1). Largeur ≥ 3,30 m, pente ≤ 2 %. Raccordement direct sans ressaut.", neuf: "Largeur 3,30 m, pente ≤ 2 %.", existant_1_4: "Emplacement proche entrée, bateau sans ressaut > 2 cm.", existant_5: "Si parking public : 1 place adaptée sauf contrainte." },
        { id: "cheminement_ext", titre: "Cheminement d'accès extérieur", desc: "Largeur libre ≥ 1,20 m. Absence d'obstacle au sol. Sol non meuble et antidérapant.", neuf: "Pente ≤ 5 % (8 % / 2 m, 10 % / 0,5 m). Paliers de repos.", existant_1_4: "Pente jusqu'à 12 % / 0,5 m si impossibilité technique.", existant_5: "Dérogation possible si dénivelé de voirie insurmontable." },
        { id: "entree_seuil", titre: "Porte d'entrée & Seuil", desc: "Largeur libre, espace de manœuvre Ø 1,50 m, seuil plat ou chanfreiné ≤ 2 cm.", neuf: "Largeur utile ≥ 0,83 m. Seuil ≤ 2 cm. Effort ≤ 50 N.", existant_1_4: "Largeur utile ≥ 0,77 m admise. Appel ext. si seuil bloquant.", existant_5: "Largeur utile ≥ 0,77 m admise. Visiophone à 0,90-1,30 m." },
        { id: "accueil_banque", titre: "Banque d'accueil & Boucle Magnétique", desc: "Poste abaissé avec vide sous table. Boucle à Induction Magnétique (BIM).", neuf: "Hauteur ≤ 0,80 m, vide 0,70×0,60 m. BIM fixe obligatoire.", existant_1_4: "Hauteur ≤ 0,80 m ou tablette. BIM fixe à l'accueil.", existant_5: "Tablette abaissée. BIM mobile tolérée." },
        { id: "eclairage_ext_accueil", titre: "Éclairage & Luxmétrie (Abords & Accueil)", desc: "Éclairement mesuré au sol et confort visuel.", neuf: "≥ 20 lux ext., ≥ 100 lux couloirs, ≥ 200 lux accueil.", existant_1_4: "≥ 20 lux ext., ≥ 200 lux à l'accueil pour lecture labiale.", existant_5: "Éclairage direct suffisant sur le visage sans contre-jour." },
        { id: "registre_rpa", titre: "Registre Public d'Accessibilité (RPA)", desc: "Mise à disposition des attestations, formation du personnel et fiches.", neuf: "RPA complet consultable sur place et en ligne.", existant_1_4: "Attestation de conformité ou agenda Ad'AP.", existant_5: "RPA obligatoire sous format allégé." }
      ],
      etage: [
        { id: "circulations_horiz", titre: "Circulations horizontales intérieures", desc: "Largeur utile, passages sans obstacle et zones de croisement.", neuf: "Largeur ≥ 1,40 m continu. Demi-tour Ø 1,50 m tous les 6 m.", existant_1_4: "Largeur ≥ 1,20 m (0,90 m ponctuel admis avec évitements).", existant_5: "Largeur ≥ 1,20 m (0,90 m toléré en secondaire)." },
        { id: "portes_interieures", titre: "Portes intérieures & Sas", desc: "Largeur de passage utile, poignées facilement manœuvrables (0,90 à 1,30 m).", neuf: "Largeur utile ≥ 0,83 m. Manœuvre hors débattement.", existant_1_4: "Largeur utile ≥ 0,77 m admise. Poignées préhensibles.", existant_5: "Largeur utile ≥ 0,77 m admise." },
        { id: "escaliers_interieurs", titre: "Escaliers intérieurs (si présents)", desc: "Sécurisation tactile, visuelle et préhension.", neuf: "BEV à 50 cm. 1re/dernière contremarches contrastées. 2 mains courantes.", existant_1_4: "Idem neuf (1 seule main courante tolérée si largeur < 1 m).", existant_5: "BEV et nez de marches antidérapants. 1 main courante tolérée." },
        { id: "ascenseur_desserte", titre: "Ascenseur / Desserte verticale", desc: "Cabine adaptée et annonces multisensorielles.", neuf: "Obligatoire si étage > 50 pers. Cabine 1,10×1,40 m.", existant_1_4: "Ascenseur obligatoire sauf disproportion ou impossibilité avérée.", existant_5: "NON OBLIGATOIRE si l'ensemble des prestations est accessible au RDC." },
        { id: "sanitaires_pmr", titre: "Cabinet d'aisances adapté (PMR)", desc: "Espace latéral de transfert, cuvette à 0,45-0,50 m et barre d'appui.", neuf: "Espace d'usage 0,80×1,30 m. Ø 1,50 m hors débattement.", existant_1_4: "Débattement sur zone de manœuvre admis si ouverture ext.", existant_5: "SANS OBJET si sanitaires réservés exclusivement au personnel." },
        { id: "acoustique_reverb", titre: "Traitement acoustique & Réverbération", desc: "Limitation de l'écho dans les espaces d'attente et réunions.", neuf: "Temps Tr ≤ 0,8 s à 1,2 s selon volume.", existant_1_4: "Traitement lors de réfections de plafonds ou revêtements.", existant_5: "Intelligibilité de la parole dans les espaces d'accueil." },
        { id: "obstacles_220", titre: "Obstacles en saillie sous 2,20 m", desc: "Détection des obstacles bas à la canne blanche.", neuf: "Élément sous 2,20 m prolongé au sol sous 0,40 m.", existant_1_4: "Écrans et sous-faces d'escaliers signalés au sol.", existant_5: "Vérifier caissons sous escaliers." },
        { id: "signaletique_vitrages", titre: "Signalétique & Vitrages", desc: "Contraste visuel et repérage des baies vitrées.", neuf: "Vitrages avec bandes à 1,10 m et 1,60 m. Signalétique à 1,30 m.", existant_1_4: "Vitrages transparents repérés. Contraste ≥ 70 %.", existant_5: "Vitrages repérés à hauteur de vue." },
        { id: "securite_eas_alarmes", titre: "Évacuation adaptée, EAS & Alarmes", desc: "Espace d'Attente Sécurisé et flashs lumineux d'alarme.", neuf: "EAS par étage accessible avec interphone. Flashs WC.", existant_1_4: "EAS dans cages d'escaliers encloisonnées. Flashs WC.", existant_5: "Diffuseurs visuels dans les locaux isolés." }
      ]
    };

    let auditActuel = {
      erpId: "",
      nom: "",
      date: new Date().toISOString().slice(0, 10),
      profil: "existant_5",
      etageActif: "tronc",
      etages: ["tronc", "RDC"],
      evaluations: {},
      parc: []
    };

    window.addEventListener('load', async () => {
      document.getElementById('dateAudit').value = auditActuel.date;
      chargerDonneesLocales();
      if (!auditActuel.parc || auditActuel.parc.length === 0) {
        await chargerParcDepuisFichier();
      } else {
        remplirSelecteurParc();
      }
      if (!auditActuel.erpId && auditActuel.parc.length > 0) {
        changerErpSelectionne(auditActuel.parc[0].id);
      } else {
        rendreInterface();
      }
    });

    async function chargerParcDepuisFichier() {
      try {
        const res = await fetch('./parc.csv');
        if (res.ok) {
          const txt = await res.text();
          traiterCsvTexte(txt);
        }
      } catch (err) {
        console.log("Lecture réseau parc.csv impossible, utilisation base locale si présente.");
      }
    }

    function traiterCsvTexte(csvText) {
      const lignes = csvText.trim().split(/\r\n|\n/);
      if (lignes.length < 2) return;

      auditActuel.parc = [];
      for (let i = 1; i < lignes.length; i++) {
        const cols = lignes[i].split(';');
        if (cols.length < 9) continue;
        const [nom, pat, cls, a15, aap, st, mt, nivStr, com] = cols;

        let cat = "5";
        if (cls.includes("1")) cat = "1";
        else if (cls.includes("2")) cat = "2";
        else if (cls.includes("3")) cat = "3";
        else if (cls.includes("4")) cat = "4";

        const isRealise = (st === "Réalisé");
        const cLow = com.toLowerCase();
        const evals = { "tronc": {}, "RDC": {} };
        const niveaux = nivStr.split(',').map(s => s.trim());
        niveaux.forEach(n => { if (n !== 'RDC') evals[n] = {}; });

        if (isRealise) {
          evals.tronc.stationnement = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.tronc.entree_seuil = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.tronc.registre_rpa = { status: "C", note: "Ad'Ap Aubagne (Réalisé)" };
          evals.RDC.escaliers_interieurs = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.RDC.ascenseur_desserte = { status: cat === "5" ? "SO" : "C", note: "Conforme" };
          evals.RDC.sanitaires_pmr = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.RDC.portes_interieures = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.RDC.circulations_horiz = { status: "C", note: "Travaux Ad'Ap réalisés" };
          evals.RDC.signaletique_vitrages = { status: "C", note: "Travaux Ad'Ap réalisés" };
        } else {
          evals.tronc.registre_rpa = { status: "NC", note: "Ad'Ap Ville d'Aubagne (en cours)" };
          if (cLow.includes("parking") || cLow.includes("place pmr")) evals.tronc.stationnement = { status: "NC", note: "Aménagement place PMR" };
          if (cLow.includes("seuil") || cLow.includes("rampe") || cLow.includes("visiophone") || cLow.includes("sas")) evals.tronc.entree_seuil = { status: "NC", note: com };
          if (cLow.includes("escalier") || cLow.includes("marche")) evals.RDC.escaliers_interieurs = { status: "NC", note: "Équipement escaliers requis" };
          if (cLow.includes("ascenseur") || cLow.includes("dérogation") || cLow.includes("disproportion")) evals.RDC.ascenseur_desserte = { status: (cLow.includes("dérogation") || cLow.includes("disproportion")) ? "SO" : "NC", note: com };
          if (cLow.includes("wc") || cLow.includes("sanit")) evals.RDC.sanitaires_pmr = { status: "NC", note: "Création / mise aux normes sanitaires PMR" };
          if (cLow.includes("porte") || cLow.includes("passage") || cLow.includes("menuiserie")) {
            evals.RDC.portes_interieures = { status: "NC", note: "Portes tiercées / passages" };
            evals.RDC.circulations_horiz = { status: "NC", note: "Largeurs circulations" };
          }
          if (cLow.includes("vitrophanie") || cLow.includes("signalétique") || cLow.includes("signaletique")) evals.RDC.signaletique_vitrages = { status: "NC", note: "Vitrophanie / signalétique requise" };
        }

        auditActuel.parc.push({
          id: "erp_" + i,
          nom: nom,
          adresse: pat ? `Aubagne (${pat})` : "Aubagne",
          categorie: cat,
          classe_erp: cls,
          acces_2015: a15,
          acces_apres: aap,
          statut_adap: st,
          commentaire_adap: com,
          montant_adap: mt ? Number(mt).toLocaleString('fr-FR') + " €" : "0 €",
          niveaux: niveaux,
          evaluations: evals
        });
      }

      remplirSelecteurParc();
      sauvegarderLocal();
    }

    function chargerFichierCsvLocal(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        traiterCsvTexte(e.target.result);
        if (auditActuel.parc.length > 0) changerErpSelectionne(auditActuel.parc[0].id);
      };
      reader.readAsText(file);
    }

    function chargerDonneesLocales() {
      const sauvg = localStorage.getItem('audit_erp_aubagne_app');
      if (sauvg) {
        try {
          auditActuel = { ...auditActuel, ...JSON.parse(sauvg) };
        } catch (e) {}
      }
    }

    function sauvegarderLocal() {
      localStorage.setItem('audit_erp_aubagne_app', JSON.stringify(auditActuel));
      calculerScore();
    }

    function remplirSelecteurParc() {
      const sel = document.getElementById('erpSelect');
      sel.innerHTML = '<option value="">-- Choisir un bâtiment d\'Aubagne --</option>';
      auditActuel.parc.forEach(erp => {
        const opt = document.createElement('option');
        opt.value = erp.id;
        opt.innerText = `${erp.nom} (${erp.classe_erp || 'Cat ' + erp.categorie}) - [${erp.statut_adap}]`;
        if (erp.id === auditActuel.erpId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function changerErpSelectionne(id) {
      const erp = auditActuel.parc.find(e => e.id === id);
      if (!erp) return;

      auditActuel.erpId = erp.id;
      auditActuel.nom = erp.nom;
      document.getElementById('nomERP').value = erp.nom;
      document.getElementById('displayErpNom').innerText = erp.nom;

      const adapBox = document.getElementById('adapInfoBox');
      adapBox.style.display = "block";
      const badge = document.getElementById('adapStatutBadge');
      badge.innerText = erp.statut_adap;
      badge.className = erp.statut_adap === 'Réalisé' ? 'adap-badge badge-realise' : 'adap-badge badge-encours';

      document.getElementById('adapTaux2015').innerText = erp.acces_2015 || 'N/A';
      document.getElementById('adapTauxCible').innerText = erp.acces_apres || '100 %';
      document.getElementById('adapMontant').innerText = erp.montant_adap || '0 €';
      document.getElementById('adapCommentaire').innerText = erp.commentaire_adap || 'Travaux réalisés';

      if (erp.categorie === "5") changerProfil('existant_5');
      else changerProfil('existant_1_4');

      auditActuel.etages = ["tronc", ...(erp.niveaux || ["RDC"])];
      auditActuel.etageActif = "tronc";
      auditActuel.evaluations = JSON.parse(JSON.stringify(erp.evaluations || {}));

      rendreOngletsEtages();
      rendreCriteres();
      sauvegarderLocal();
    }

    function mettreAJourNom(val) {
      auditActuel.nom = val || "Audit";
      document.getElementById('displayErpNom').innerText = auditActuel.nom;
      sauvegarderLocal();
    }

    function changerProfil(p) {
      auditActuel.profil = p;
      document.querySelectorAll('.profile-tab').forEach(el => el.classList.remove('active'));
      const tab = document.getElementById(`prof_${p}`);
      if (tab) tab.classList.add('active');
      
      const badge = document.getElementById('currentCategoryBadge');
      if (p === 'neuf') badge.innerText = "Neuf (Arrêté 2017)";
      else if (p === 'existant_1_4') badge.innerText = "Existant (Cat 1 à 4)";
      else badge.innerText = "Existant (5e Catégorie)";

      rendreCriteres();
      sauvegarderLocal();
    }

    function selectionnerEtage(etage) {
      auditActuel.etageActif = etage;
      document.querySelectorAll('.etage-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.etage-btn')).find(b => b.innerText.includes(etage === 'tronc' ? 'Extérieurs' : etage));
      if (activeBtn) activeBtn.classList.add('active');
      rendreCriteres();
    }

    function ajouterEtage() {
      const nom = prompt("Désignation du niveau (ex: R+1, Sous-sol, Mezzanine) :");
      if (!nom || auditActuel.etages.includes(nom)) return;
      auditActuel.etages.push(nom);
      rendreOngletsEtages();
      selectionnerEtage(nom);
      sauvegarderLocal();
    }

    function rendreOngletsEtages() {
      const cont = document.getElementById('etagesConteneur');
      cont.innerHTML = `<button type="button" class="etage-btn ${auditActuel.etageActif === 'tronc' ? 'active' : ''}" onclick="selectionnerEtage('tronc')">Extérieurs & Accueil</button>`;
      auditActuel.etages.filter(e => e !== 'tronc').forEach(et => {
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = `etage-btn ${auditActuel.etageActif === et ? 'active' : ''}`;
        btn.innerText = et;
        btn.onclick = () => selectionnerEtage(et);
        cont.appendChild(btn);
      });
    }

    function rendreCriteres() {
      const cont = document.getElementById('listeCriteres');
      cont.innerHTML = "";
      const liste = auditActuel.etageActif === 'tronc' ? REFERENTIEL.tronc : REFERENTIEL.etage;

      if (!auditActuel.evaluations[auditActuel.etageActif]) auditActuel.evaluations[auditActuel.etageActif] = {};
      const evalEtage = auditActuel.evaluations[auditActuel.etageActif];

      liste.forEach(crit => {
        const etat = evalEtage[crit.id] || { status: null, note: "", photos: [] };
        const regle = crit[auditActuel.profil] || crit.desc;

        const card = document.createElement('div');
        card.className = "criterion-item";
        card.innerHTML = `
          <div class="crit-title">${crit.titre}</div>
          <div class="crit-desc">${crit.desc}</div>
          <div style="background:#0f172a; padding:6px 10px; border-radius:6px; font-size:0.75rem; color:#38bdf8; margin-bottom:8px; border-left:3px solid var(--primary);">
            <strong>Règle profil :</strong> ${regle}
          </div>
          <div class="status-btns">
            <div class="status-btn c ${etat.status === 'C' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'C')">Conforme</div>
            <div class="status-btn nc ${etat.status === 'NC' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'NC')">Non Conforme</div>
            <div class="status-btn so ${etat.status === 'SO' ? 'active' : ''}" onclick="definirStatut('${crit.id}', 'SO')">Sans Objet</div>
          </div>
          <div class="print-status">Constat : <strong>${etat.status || 'Non vérifié'}</strong></div>
          <textarea placeholder="Constats techniques, cotes relevées, réserves..." style="margin-bottom:6px; height:50px;" oninput="majNote('${crit.id}', this.value)">${etat.note || ''}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="margin:0; cursor:pointer; font-size:0.75rem; color:var(--primary-light);">
              📷 Prendre une photo
              <input type="file" accept="image/*" capture="environment" style="display:none" onchange="ajouterPhoto('${crit.id}', event)">
            </label>
            <div class="photo-preview-wrap" id="photos_${crit.id}">
              ${(etat.photos || []).map(src => `<img src="${src}" class="photo-thumb">`).join('')}
            </div>
          </div>
        `;
        cont.appendChild(card);
      });
      calculerScore();
    }

    function definirStatut(id, s) {
      if (!auditActuel.evaluations[auditActuel.etageActif]) auditActuel.evaluations[auditActuel.etageActif] = {};
      if (!auditActuel.evaluations[auditActuel.etageActif][id]) auditActuel.evaluations[auditActuel.etageActif][id] = { status: null, note: "", photos: [] };
      auditActuel.evaluations[auditActuel.etageActif][id].status = s;
      rendreCriteres();
      sauvegarderLocal();
    }

    function majNote(id, v) {
      if (!auditActuel.evaluations[auditActuel.etageActif]) auditActuel.evaluations[auditActuel.etageActif] = {};
      if (!auditActuel.evaluations[auditActuel.etageActif][id]) auditActuel.evaluations[auditActuel.etageActif][id] = { status: null, note: "", photos: [] };
      auditActuel.evaluations[auditActuel.etageActif][id].note = v;
      sauvegarderLocal();
    }

    function ajouterPhoto(id, ev) {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

          if (!auditActuel.evaluations[auditActuel.etageActif]) auditActuel.evaluations[auditActuel.etageActif] = {};
          if (!auditActuel.evaluations[auditActuel.etageActif][id]) auditActuel.evaluations[auditActuel.etageActif][id] = { status: null, note: "", photos: [] };
          if (!auditActuel.evaluations[auditActuel.etageActif][id].photos) auditActuel.evaluations[auditActuel.etageActif][id].photos = [];
          auditActuel.evaluations[auditActuel.etageActif][id].photos.push(dataUrl);
          rendreCriteres();
          sauvegarderLocal();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function calculerScore() {
      let conformes = 0, nonConformes = 0;
      Object.keys(auditActuel.evaluations).forEach(et => {
        const obj = auditActuel.evaluations[et];
        Object.keys(obj).forEach(cId => {
          const s = obj[cId].status;
          if (s === 'C') conformes++;
          else if (s === 'NC') nonConformes++;
        });
      });
      const total = conformes + nonConformes;
      const score = total > 0 ? Math.round((conformes / total) * 100) : 0;
      document.getElementById('gaugeBar').style.width = `${score}%`;
      document.getElementById('gaugeScore').innerText = `${score} %`;
    }

    function rendreInterface() {
      document.getElementById('displayErpNom').innerText = auditActuel.nom || 'Sélectionner un ERP';
      document.getElementById('nomERP').value = auditActuel.nom || '';
      document.getElementById(`prof_${auditActuel.profil}`).click();
      rendreOngletsEtages();
      rendreCriteres();
    }

    function exporterAuditJSON() {
      const blob = new Blob([JSON.stringify(auditActuel, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Audit_${auditActuel.nom.replace(/\s+/g, '_')}_${auditActuel.date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importerAuditJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          auditActuel = JSON.parse(e.target.result);
          remplirSelecteurParc();
          rendreInterface();
          alert("Audit rechargé avec succès !");
        } catch (err) {
          alert("Erreur de lecture du JSON.");
        }
      };
      reader.readAsText(file);
    }

    function exporterSyntheseCSV() {
      let csv = "Zone/Niveau;Critere;Statut;Constat\n";
      Object.keys(auditActuel.evaluations).forEach(et => {
        const obj = auditActuel.evaluations[et];
        Object.keys(obj).forEach(cId => {
          const item = obj[cId];
          csv += `"${et}";"${cId}";"${item.status || ''}";"${(item.note || '').replace(/"/g, '""')}"\n`;
        });
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Synthese_${auditActuel.nom.replace(/\s+/g, '_')}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
